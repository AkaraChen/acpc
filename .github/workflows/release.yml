# Build acpc for every supported platform when a v* tag is pushed, keep the
# archives as workflow artifacts and publish them on a GitHub Release.
#
# Build caches: GitHub scopes a cache to the ref that saved it, and every tag
# is a new ref, so a tag run never finds the previous tag's cache. Runs on
# main (manual or weekly, below) save the dependency cache; tag runs, which may read the
# default branch's caches, only restore it and do not save their own.
name: release

on:
  push:
    tags: ["v*"]
  # Warm the cache by hand (Actions > release > Run workflow, branch main,
  # e.g. after Cargo.lock or UPSTREAM changed), and weekly so the entries are
  # not evicted unused.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Ship stripped binaries; upstream keeps symbols for its own archives.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "symbols"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15 }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # git am in sync-upstream needs the patches byte-for-byte.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Sync upstream Codex and apply patches
        run: scripts/sync-upstream

      - name: Install Rust toolchain
        working-directory: third_party/codex/codex-rs
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add "$TARGET"

      - name: Install Zig (musl)
        if: contains(matrix.target, 'linux-musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        env:
          CODEX_MUSL_RELEASE_LINK_FLAGS: "1"
        run: |
          bash third_party/codex/.github/scripts/install-musl-build-tools.sh
          # Avoid aws-lc's jitter entropy code path on musl (as upstream).
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          var="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "${var}=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/codex/codex-rs
          key: ${{ matrix.target }}
          # Only main saves: tag caches are never read again and would evict
          # the main ones from the repository's 10 GiB cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: third_party/codex/codex-rs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export ACPC_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --release --locked --target "$TARGET" -p acpc --bin acpc

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          stage="$RUNNER_TEMP/acpc-$TARGET"
          mkdir -p "$stage" dist
          cp README.md LICENSE "$stage/"
          bin_dir="third_party/codex/codex-rs/target/$TARGET/release"
          if [[ "$TARGET" == *windows* ]]; then
            archive="acpc-$TARGET.zip"
            cp "$bin_dir/acpc.exe" "$stage/"
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$archive" . >/dev/null)
          else
            archive="acpc-$TARGET.tar.gz"
            cp "$bin_dir/acpc" "$stage/"
            tar -czf "dist/$archive" -C "$stage" .
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: acpc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: acpc-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "acpc $GITHUB_REF_NAME" --generate-notes --verify-tag
